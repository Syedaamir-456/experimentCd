<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell a Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Computer Parts Store</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="sell.html">Sell</a></li>
                <li><a href="account.html">Account</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Sell Your Product</h2>
        <form id="sell-form">
            <label for="product-name">Product Name:</label>
            <input type="text" id="product-name" name="product-name" required>

            <label for="product-description">Product Description:</label>
            <textarea id="product-description" name="product-description" required></textarea>

            <label for="product-price">Price:</label>
            <input type="number" id="product-price" name="product-price" min="0" step="0.01" required>

            <label for="product-image">Product Image:</label>
            <input type="file" id="product-image" name="product-image" accept="image/*" required>

            <label for="product-category">Product Category:</label>
            <select id="product-category" name="product-category" required>
                <option value="">Select a category</option>
                <option value="cpu">CPU</option>
                <option value="motherboard">Motherboard</option>
                <option value="ram">RAM</option>
                <option value="storage">Storage</option>
                <option value="gpu">GPU</option>
                <option value="case">Case</option>
                <option value="power-supply">Power Supply</option>
            </select>

            <label for="product-company">Company:</label>
            <input type="text" id="product-company" name="product-company" required>

            <button type="submit">Sell Product</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 Computer Parts Store</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
